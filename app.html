<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency & Crypto Converter</title>
    <link rel="stylesheet" href="app.css">
</head>
<body>
    <header>
        <h1>Currency & Crypto Converter</h1>
        <p>All-in-one converter for fiat and crypto currencies</p>
    </header>

    <div class="container">

        <!-- Fiat Buttons -->
        <div class="section">
            <h2>Fiat Currency Converter</h2>
            <button id="fiatConvert">Convert Fiat Currency</button>
        </div>

        <!-- Crypto Buttons -->
        <div class="section">
            <h2>Crypto Menu</h2>
            <button id="showCryptoPrices">Show Live Crypto Prices</button>
            <button id="convertToCrypto">Convert Fiat to Crypto</button>
        </div>

    </div>

    <script src="app.js"></script>
</body>
</html>
